<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">

        <link href="../css/styles.css" rel="stylesheet">
        <link href="../css/bootstrap.css" rel="stylesheet">
        <!-- <link href="../css/fontawesome-all.css" rel="stylesheet"> -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
        <link rel="icon" href="images/organ-donation-logo-new.svg">
        <script src="../main.js"></script>

        <style>
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                min-height: 100vh;
                font-family: 'Montserrat', sans-serif;
            }
            
            .header-section {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            }
            
            .main-content {
                background: rgba(255, 255, 255, 0.9);
                border-radius: 20px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
                backdrop-filter: blur(10px);
                margin: 20px auto;
                padding: 30px;
                max-width: 1200px;
            }
            
            .card {
                border: none;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
                overflow: hidden;
            }
            
            .card-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
                border: none;
                padding: 25px;
            }
            
            .form-control, .form-select {
                border-radius: 10px;
                border: 2px solid #e9ecef;
                padding: 12px 15px;
                transition: all 0.3s ease;
            }
            
            .form-control:focus, .form-select:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }
            
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                border-radius: 10px;
                padding: 12px 30px;
                font-weight: 600;
                transition: all 0.3s ease;
            }
            
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            }
            
            .btn-secondary {
                background: rgba(255, 255, 255, 0.9);
                border: 2px solid #667eea;
                color: #667eea;
                border-radius: 10px;
                padding: 10px 20px;
                font-weight: 600;
                transition: all 0.3s ease;
            }
            
            .btn-secondary:hover {
                background: #667eea;
                color: white;
                transform: translateY(-2px);
            }
            
            .form-check-input:checked {
                background-color: #667eea;
                border-color: #667eea;
            }
            
            .alert {
                border-radius: 10px;
                border: none;
            }
            
            .alert-success {
                background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
                color: white;
            }
            
            .floating-elements {
                position: absolute;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: -1;
            }
            
            .float-card {
                position: absolute;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 15px;
                backdrop-filter: blur(5px);
                animation: float 6s ease-in-out infinite;
            }
            
            .card-1 {
                top: 10%;
                left: 5%;
                width: 100px;
                height: 100px;
                animation-delay: 0s;
            }
            
            .card-2 {
                top: 60%;
                right: 10%;
                width: 80px;
                height: 80px;
                animation-delay: 2s;
            }
            
            .card-3 {
                bottom: 20%;
                left: 15%;
                width: 120px;
                height: 120px;
                animation-delay: 4s;
            }
            
            @keyframes float {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-20px); }
            }
        </style>

        <title>Donor Registration</title>
    </head>

    <body>
        <div class="floating-elements">
            <div class="float-card card-1"></div>
            <div class="float-card card-2"></div>
            <div class="float-card card-3"></div>
        </div>
        
    <!-- start of navigation-->
    <header class="header-section">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <nav>
                        <a href="index.html"><img class="nav-logo"  src="../images/Screenshot__14_-removebg-preview.png" alt="Organ Donation Platform"></a>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <!-- end of navigation-->

    <button onclick="window.history.back()" class="btn btn-secondary mt-3 ml-3">← Back</button>

           
            <main class="main-content">
                <div class="container py-5 text-center">
                    <button id="connectWalletBtn" class="btn btn-primary btn-lg" onclick="App.connect()">Connect with MetaMask</button>
                    <div id="walletInfo" class="alert alert-success mt-3" style="display:none;"></div>
                </div>
                <div id="registrationForm" style="display:none;">
                    <div class="container py-5">
                        <div class="row justify-content-center">
                            <div class="col-md-7 col-lg-6">
                                <div class="card shadow-lg">
                                    <div class="card-header bg-primary text-white text-center">
                                        <h3 class="mb-0 fw-bold text-white" style="color: #fff !important; font-weight: 900 !important;"><i class="fas fa-user-plus"></i> Register an Organ Donor</h3>
                                    </div>
                                    <div class="card-body">
                                <form>
                                            <div class="mb-3">
                                                <label for="DonorFullName" class="form-label fw-bold">Full Name</label>
                                                <input type="text" class="form-control" id="DonorFullName" placeholder="Full name">
                                            </div>
                                            <div class="mb-3">
                                                <label for="DonorAge" class="form-label fw-bold">Age</label>
                                                <input type="number" class="form-control" id="DonorAge" placeholder="Age" min="0">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label fw-bold">Gender</label>
                                                <div>
                                                    <div class="form-check form-check-inline">
                                                        <input class="form-check-input" type="radio" name="gender" id="donorGenderMale" value="Male">
                                                        <label class="form-check-label fw-bold" for="donorGenderMale">Male</label>
                                                    </div>
                                                    <div class="form-check form-check-inline">
                                                        <input class="form-check-input" type="radio" name="gender" id="donorGenderFemale" value="Female">
                                                        <label class="form-check-label fw-bold" for="donorGenderFemale">Female</label>
                                                    </div>
                                                    <div class="form-check form-check-inline">
                                                        <input class="form-check-input" type="radio" name="gender" id="donorGenderOther" value="Others">
                                                        <label class="form-check-label fw-bold" for="donorGenderOther">Others</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="mb-3">
                                                <label for="DonorMedicalID" class="form-label fw-bold">Medical ID</label>
                                                <input type="text" class="form-control" id="DonorMedicalID" placeholder="Donor Medical ID">
                                            </div>
                                            <div class="mb-3">
                                                <label for="DonorBloodType" class="form-label fw-bold">Blood Type</label>
                                                <select class="form-select" id="DonorBloodType">
                                                    <option value="">Select blood type</option>
                                        <option value="A-">A-</option>
                                        <option value="A+">A+</option>
                                        <option value="B-">B-</option>
                                        <option value="B+">B+</option>
                                        <option value="AB-">AB-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="O-">O-</option>
                                        <option value="O+">O+</option>
                                        </select>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label fw-bold">Organ(s) to Donate</label>
                                                <div class="row">
                                                    <div class="col-6 col-md-4">
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organLeftKidney" value="Left Kidney">
                                                            <label class="form-check-label fw-bold" for="organLeftKidney">Left Kidney</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organRightKidney" value="Right Kidney">
                                                            <label class="form-check-label fw-bold" for="organRightKidney">Right Kidney</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organLeftLung" value="Left Lung">
                                                            <label class="form-check-label fw-bold" for="organLeftLung">Left Lung</label>
                                                        </div>
                                                    </div>
                                                    <div class="col-6 col-md-4">
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organRightLung" value="Right Lung">
                                                            <label class="form-check-label fw-bold" for="organRightLung">Right Lung</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organLiver" value="Liver">
                                                            <label class="form-check-label fw-bold" for="organLiver">Liver</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organHeart" value="Heart">
                                                            <label class="form-check-label fw-bold" for="organHeart">Heart</label>
                                                        </div>
                                                    </div>
                                                    <div class="col-12 col-md-4">
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organPancreas" value="Pancreas">
                                                            <label class="form-check-label fw-bold" for="organPancreas">Pancreas</label>
                                                        </div>
                                                        <div class="form-check">
                                                            <input class="form-check-input" type="checkbox" name="Organ" id="organIntestine" value="Intestine">
                                                            <label class="form-check-label fw-bold" for="organIntestine">Intestine</label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="mb-3">
                                                <label for="DonorWeight" class="form-label fw-bold">Weight (kg)</label>
                                                <input type="number" class="form-control" id="DonorWeight" placeholder="Weight" min="0">
                                            </div>
                                            <div class="mb-3">
                                                <label for="DonorHeight" class="form-label fw-bold">Height (cm)</label>
                                                <input type="number" class="form-control" id="DonorHeight" placeholder="Height" min="0">
                                            </div>
                                            <div class="d-grid gap-2">
                                                <button type="submit" class="btn btn-primary register" onclick="App.register('Donor'); return false;">Register</button>
                                        </div>
                                    </form>
                                    </div>
                                </div>
                                <!-- Alert Section -->
                                <div class="mt-4">
                                    <div class="alert warning d-flex justify-content-between align-items-center" role="alert">
                                        <span id="DonorInputCheck"></span>
                                <span class="closebtn" onclick="App.closeAlert();">&times;</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
    </body>
    <script>
        window.addEventListener('load', function() {
            App.start();
        });
    </script>
</html>
